name: Build and push Docker image

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-runpod:${{ env.DATE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/comfyui-runpod:latest
          build-args: |
            BASE_IMAGE=nvidia/cuda:12.8.1-cudnn-devel-ubuntu24.04
        env:
          DATE_TAG: ${{ format('MM-dd', github.event.head_commit?.timestamp || github.run_started_at) }}
